{{- if .Values.singlePod }}
{{- $tiers := splitList " " (include "nodevitals.enabledTiers" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nodevitals
  labels:
    app.kubernetes.io/name: nodevitals
    app.kubernetes.io/component: single
data:
  config.yaml: |
    tiers: [{{ join ", " $tiers }}]
    intervalSeconds: {{ .Values.intervalSeconds }}
    procRoot: /host/proc
    sysRoot: /host/sys
    devRoot: /host/dev
    # 활성 tier 의 룰을 한 목록으로 합친다. 이벤트 엔진은 metric 이름으로
    # 매칭하고 tier 별 metric 이름은 서로 겹치지 않으므로(load1·cpu_util_pct /
    # smart_*·nvme_* / gpu_*) 합쳐도 각 룰은 자기 tier 샘플에만 걸린다.
    rules:
{{- if .Values.tiers.core.enabled }}
{{ toYaml .Values.rules | indent 6 }}
{{- end }}
{{- if .Values.tiers.smart.enabled }}
{{ toYaml .Values.smartRules | indent 6 }}
{{- end }}
{{- if .Values.tiers.gpu.enabled }}
{{ toYaml .Values.gpuRules | indent 6 }}
{{- end }}
{{- if .Values.nodeExporter.enabled }}
    nodeExporter:
      enabled: true
      {{- if .Values.nodeExporter.mountRootFS }}
      rootfsPath: /host/root
      {{- end }}
      {{- if .Values.nodeExporter.nativeCollectors }}
      nativeCollectors: true
      {{- end }}
      {{- with .Values.nodeExporter.textfileDir }}
      textfileDir: {{ . | quote }}
      {{- end }}
      {{- /* nativeCollectors 와 --no-collector.* 6종은 여기, 렌더 시점에 묶는다 — values
           기본값에 두면 extraFlags 를 통째로 교체하는 오버라이드(Helm 은 리스트를
           병합하지 않고 치환한다)가 토글과 flags 짝을 끊어, 임베드·네이티브 컬렉터가
           같은 이름을 동시에 내는 registry 충돌로 이어질 수 있다. processes 는 여기 없다 —
           node_procs_running/blocked 는 node_exporter 의 stat 컬렉터(기본 활성) 소유라
           --no-collector.processes 로는 끌 수 없다(§internal/nodecompat/upstream.go 주석). */}}
      {{- $extraFlags := .Values.nodeExporter.extraFlags | default list }}
      {{- if .Values.nodeExporter.nativeCollectors }}
      {{- $extraFlags = concat $extraFlags (list "--no-collector.loadavg" "--no-collector.filefd" "--no-collector.entropy" "--no-collector.vmstat" "--no-collector.uname" "--no-collector.os") }}
      {{- end }}
      {{- with $extraFlags }}
      extraFlags:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}
{{- if and .Values.tiers.gpu.enabled .Values.dcgmCompat.enabled }}
    dcgmCompat:
      enabled: true
{{- end }}
{{- if and .Values.tiers.smart.enabled .Values.smartctlCompat.enabled }}
    smartctlCompat:
      enabled: true
{{- end }}
{{- if .Values.history.enabled }}
    history:
      enabled: true
      retentionDays: {{ .Values.history.retentionDays }}
      intervalMinutes: {{ .Values.history.intervalMinutes }}
      dataDir: {{ .Values.history.mountPath | quote }}
      {{- with .Values.history.metrics }}
      metrics:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}
    sinks:
      metrics:
        enabled: true
        listenAddr: ":{{ .Values.metrics.port }}"
      # webhook.secret 은 ${WEBHOOK_SECRET_N} placeholder 로만 렌더 — 실제 키는 nodevitals-webhooks Secret 에서 env(secretKeyRef) 주입 (ConfigMap 평문 아님)
      webhook:
{{ include "nodevitals.webhookConfig" . | indent 8 }}
{{- end }}
